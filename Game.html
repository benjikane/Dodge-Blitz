<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dodge Blitz</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: white;
    font-family: 'Arial', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  canvas {
    background: radial-gradient(circle at center, #1a1a2e, #0a0a0f);
    border: 2px solid #7c3aed;
    border-radius: 16px;
    box-shadow: 0 0 30px #7c3aed55;
    touch-action: none;
  }
  #ui {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    font-size: 2rem;
    font-weight: 900;
  }
  #gameover {
    position: absolute;
    background: #000000cc;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    display: none;
  }
  #gameover button {
    background: linear-gradient(90deg, #7c3aed, #22d3ee);
    border: none;
    color: white;
    padding: 15px 30px;
    font-size: 1.2rem;
    font-weight: 700;
    border-radius: 12px;
    margin-top: 15px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="ui">Score: 0</div>
<canvas id="game" width="400" height="600"></canvas>
<div id="gameover">
  <h2>💀 GAME OVER 💀</h2>
  <p>Score: <span id="finalScore">0</span></p>
  <p>Best: <span id="bestScore">0</span></p>
  <button onclick="startGame()">PLAY AGAIN</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const ui = document.getElementById('ui');
const gameoverEl = document.getElementById('gameover');

let player, enemies, score, gameRunning, speed;
let best = localStorage.getItem('dodge_best') || 0;
document.getElementById('bestScore').textContent = best;

function startGame() {
  player = { x: 200, y: 550, r: 15, dx: 0, dy: 0 };
  enemies = [];
  score = 0;
  speed = 2;
  gameRunning = true;
  gameoverEl.style.display = 'none';
  spawnEnemy();
  gameLoop();
}

function spawnEnemy() {
  if(!gameRunning) return;
  enemies.push({
    x: Math.random() * 380 + 10,
    y: -20,
    r: 10 + Math.random() * 10,
    speed: speed + Math.random() * 2
  });
  setTimeout(spawnEnemy, 800 - speed * 50);
}

function gameLoop() {
  if(!gameRunning) return;
  ctx.clearRect(0, 0, 400, 600);

  // Move player
  player.x += player.dx;
  player.y += player.dy;
  player.x = Math.max(player.r, Math.min(400 - player.r, player.x));
  player.y = Math.max(player.r, Math.min(600 - player.r, player.y));

  // Draw player
  ctx.fillStyle = '#22d3ee';
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fill();

  // Move and draw enemies
  enemies.forEach((e, i) => {
    e.y += e.speed;
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.fill();

    // Collision
    let dist = Math.hypot(player.x - e.x, player.y - e.y);
    if(dist < player.r + e.r) {
      gameOver();
    }

    // Remove off screen + score
    if(e.y > 620) {
      enemies.splice(i, 1);
      score++;
      ui.textContent = 'Score: ' + score;
      if(score % 10 === 0) speed += 0.3;
    }
  });

  requestAnimationFrame(gameLoop);
}

function gameOver() {
  gameRunning = false;
  if(score > best) {
    best = score;
    localStorage.setItem('dodge_best', best);
  }
  document.getElementById('finalScore').textContent = score;
  document.getElementById('bestScore').textContent = best;
  gameoverEl.style.display = 'block';
}

// Controls - Keyboard
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowLeft') player.dx = -5;
  if(e.key === 'ArrowRight') player.dx = 5;
  if(e.key === 'ArrowUp') player.dy = -5;
  if(e.key === 'ArrowDown') player.dy = 5;
});
document.addEventListener('keyup', e => {
  if(['ArrowLeft','ArrowRight'].includes(e.key)) player.dx = 0;
  if(['ArrowUp','ArrowDown'].includes(e.key)) player.dy = 0;
});

// Controls - Touch
let touchStartX, touchStartY;
canvas.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});
canvas.addEventListener('touchmove', e => {
  let dx = e.touches[0].clientX - touchStartX;
  let dy = e.touches[0].clientY - touchStartY;
  player.x += dx * 0.2;
  player.y += dy * 0.2;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});

startGame();
</script>
</body>
</html>
